---
- name: Clone multiple VMs from template in Proxmox (all shell)
  hosts: proxmox
  gather_facts: false
  serial: 1
  vars_files:
    - ../group_vars/proxmox.yml

  tasks:
    - name: Loop through k8s_cluster group and print details
      ansible.builtin.debug:
        msg: 
          - "=== VM Details ==="
          - "Name: {{ item }}"
          - "VM ID: {{ hostvars[item].vm_id }}"
          - "Memory: {{ hostvars[item].vm_memory }}MB"
          - "Cores: {{ hostvars[item].vm_cores }}"
          - "Disk: {{ hostvars[item].vm_disk_size }}"
          - "MAC: {{ hostvars[item].vm_mac }}"
          - "Role: {{ hostvars[item].vm_role }}"
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "VM: {{ item }}"

    - name: Clone VMs from template
      ansible.builtin.shell: qm clone {{ template_vm_id }} {{ hostvars[item].vm_id }} --name {{ item }} --full
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "Cloning {{ item }}"

    - name: Increase cores and memory for each clone
      ansible.builtin.shell: qm set {{ hostvars[item].vm_id }} --cores {{ hostvars[item].vm_cores }} --memory {{ hostvars[item].vm_memory }}
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "Setting CPU and memory for {{ item }}"

    - name: Resize disk of each clone before first boot
      ansible.builtin.shell: qm resize {{ hostvars[item].vm_id }} scsi0 {{ hostvars[item].vm_disk_size }}
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "Resizing disk for {{ item }}"
      when: disk_resize_enable | default(false) | bool

    - name: Set unique MAC address for each VM
      ansible.builtin.shell: qm set {{ hostvars[item].vm_id }} --net0 virtio,bridge=vmbr0,macaddr={{ hostvars[item].vm_mac }}
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "Setting MAC for {{ item }}"



