---
- name: Start newly created VMs and login after delay
  hosts: proxmox
  gather_facts: false
  vars_files:
  - ../group_vars/proxmox.yml
  vars:
    login_command: "whoami"

  tasks:
    - name: Start each VM
      ansible.builtin.shell: qm start {{ hostvars[item].vm_id }}
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "Starting {{ item }}"

    - name: Wait 5 minutes for VMs to boot and cloud-init to finish
      ansible.builtin.pause:
        minutes: 5

    - name: Attempt SSH login and run command on each VM
      ansible.builtin.command: "{{ login_command }}"
      loop: "{{ groups['k8s_cluster'] }}"
      loop_control:
        label: "Logging into {{ item }}"

