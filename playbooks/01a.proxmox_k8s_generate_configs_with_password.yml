---
- name: Generate configuration files from templates (Password Authentication)
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/vault.yml
  
  tasks:
    - name: Log configuration generation start (Password Mode)
      ansible.builtin.debug:
        msg: "Generating configs with password authentication"
    
    - name: Create directories to hold generated group vars and inventory files
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "../inventory"
      register: dir_creation
    
    
    - name: Generate proxmox group vars from template
      ansible.builtin.template:
        src: ../templates/group_vars/proxmox.yml.j2
        dest: ../group_vars/proxmox.yml
        mode: '0644'
      register: proxmox_group_vars
    
    
    - name: Generate proxmox inventory from password template  
      ansible.builtin.template:
        src: ../templates/inventory/proxmox.ini_with_ssh_passwd.j2
        dest: ../inventory/proxmox.ini
        mode: '0644'
      register: proxmox_inventory
    
    - name: Generate k8s VMs group vars from template
      ansible.builtin.template:
        src: ../templates/group_vars/k8s_vm.yml.j2
        dest: ../group_vars/k8s_vm.yml
        mode: '0644'

    - name: Generate k8s VMs inventory from template
      ansible.builtin.template:
        src: ../templates/inventory/k8s_vms.ini.j2
        dest: ../inventory/k8s_vms.ini
        mode: '0644'
